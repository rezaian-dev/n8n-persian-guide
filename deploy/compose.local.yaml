# LOCAL DEMO ONLY: fake data, not an internet-facing deployment.
services:
  n8n:
    image: n8nio/n8n:2.45.7
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Tehran
      GENERIC_TIMEZONE: Asia/Tehran
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_local_data:/home/node/.n8n
    restart: unless-stopped
volumes:
  n8n_local_data:
